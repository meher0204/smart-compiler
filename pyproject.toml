[project]
name = "smart-compiler"
version = "0.1.0"
description = "A fault-tolerant compiler front end with error detection, recovery, and AI-assisted diagnostics."
requires-python = ">=3.11"
dependencies = [
    "rich",
]

[project.scripts]
scompiler = "scompiler.cli:main"

[project.optional-dependencies]
ai = [
    "anthropic",
]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.setuptools.packages.find]
where = ["src"]